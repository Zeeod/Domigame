# Dominion: docker compose up -d --build   then open http://<your-machine>:3005
services:
  dominion:
    build:
      context: .
      dockerfile: Dockerfile
    image: dominion:latest
    container_name: dominion
    restart: unless-stopped

    ports:
      # Change the left number to use another port on your machine (e.g. "8080:3005")
      - "3005:3005"

    environment:
      - NODE_ENV=production
      - PORT=3005
      # Only needed if the page is served from another address than the game server
      # (otherwise leave "*"). Example behind a reverse proxy: https://dominion.example.com
      - CLIENT_URL=*
      - SOCKET_PATH=/socket.io/

    volumes:
      # Saved games (to resume after a restart or an update)
      - ./data:/app/data
